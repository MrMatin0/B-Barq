name: Instrumented tests

# Why not on every PR: a cold emulator boot plus connectedCheck costs 10-15
# minutes per matrix leg on a GitHub-hosted runner, which would more than double
# the feedback loop for a one-line change. So: opt in per PR with the
# `instrumented` label, plus a nightly run on master that nobody has to remember.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # 02:00 UTC, i.e. 05:30 Tehran time.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instrumented-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: temurin
  GRADLE_FLAGS: "--stacktrace"

jobs:
  connected-check:
    name: connectedCheck (API ${{ matrix.api-level }})
    # Label-gated on pull requests, unconditional on schedule and dispatch.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'instrumented')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          # minSdk: the oldest thing this app claims to support.
          - api-level: 24
            target: default
            arch: x86
          # A current API level. 35 rather than 36 because its system images are
          # the newest ones with a track record on hosted runners.
          - api-level: 35
            target: google_apis
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Hardware acceleration on hosted runners needs the kvm device to be
      # writable by the runner user (documented in the action's README).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Runs verifyRoomSchemas first (wired via connectedCheck in
      # app/build.gradle.kts), so a missing exported schema fails here loudly
      # instead of the migration tests passing by doing nothing.
      - name: connectedCheck
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: pixel_2
          ram-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 900
          script: ./gradlew connectedDebugAndroidTest ${{ env.GRADLE_FLAGS }}

      - name: Upload instrumentation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: connected-reports-api${{ matrix.api-level }}-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
