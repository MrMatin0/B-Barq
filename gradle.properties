# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users: Gradle settings configured through the IDE
# *will override* any settings specified in this file.

# --- Application version -----------------------------------------------------
# Single source of truth for the app version. app/build.gradle.kts reads these
# through providers.gradleProperty(...) and derives:
#   versionCode = versionMajor * 10000 + versionPatch   (3, 73 -> 30073)
#   versionName = "$versionMajor.$versionPatch"         (-> "3.73")
# The release workflow reconciles the pushed v* tag against versionName, so
# bumping the app version means editing exactly these two lines.
# Override locally with -Pbbarq.versionPatch=74 without touching the file.
bbarq.versionMajor=3
bbarq.versionPatch=73

# --- Daemon / performance ---------------------------------------------------
# 2048m was not enough headroom for KSP + Hilt + R8 in one daemon.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# AGP 8.11, KSP 2.2 and Hilt 2.57 all support the configuration cache. If a
# plugin ever regresses, this is the one line to delete.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# --- Kotlin -----------------------------------------------------------------
kotlin.code.style=official
kotlin.incremental=true

# --- Android ----------------------------------------------------------------
# AndroidX package structure.
android.useAndroidX=true
# Each library's R class contains only its own resources.
android.nonTransitiveRClass=true
# NOTE: android.nonFinalResIds is deliberately not set: it has defaulted to
# true since AGP 8.0, so writing it down would be cargo cult.
